<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Crayon Bleu</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- librairies -->
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.dom.js"></script>
    <!-- tools -->
    <script src="toolbox.js"></script>
    <script src="colourPalette.js"></script>
    <script src="helperFunctions.js"></script>
    <script src="freehandTool.js"></script>
    <script src="lineToTool.js"></script>
    <script src="sprayCanTool.js"></script>
    <script src="mirrorDrawTool.js"></script>
    <script src="ellipseTool.js"></script>
    <script src="rectangleTool.js"></script>
    <script src="eraserTool.js"></script>
    <script src="textTool.js"></script>
    <!-- links to other pages -->
    <script src="sketch.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body class="wrapper">
    <header class="box header">
      <h4 class="header__title">Crayon Bleu</h4>
      <div class="header__actions">
        <button id="undoButton">&larr;</button>
        <button id="redoButton">&rarr;</button>
        <button id="clearButton">&#8634;</button>
        <button id="saveImageButton">&#10515;</button>
      </div>
    </header>
    
    <!-- sidebar icon -->
    <div class="box" id="sidebar"></div>
    <!-- canva -->
    <div id="content"></div>

    <div class="box colourPalette"></div>
    <div class="box options"></div>
    
    <!-- templates hidden tools -->
    <div id="text-tool-template" style="display:none;">
      <div class="text-tool">
        <div class="text-tool__input">
          <label class="text-tool__label">Text</label>
          <textarea id="textContent" rows="3" class="text-tool__textarea"></textarea>
          <div class="text-tool__actions"><button id="clearText">Clear Text</button></div>
        </div>
        <div class="text-tool__controls">
          <div class="text-tool__box">
            <label>Size</label>
            <input id="textSize" type="number" min="6" max="200" class="text-tool__input-number"/>
          </div>
          <div class="text-tool__box">
            <label>Color</label>
            <input id="textColor" type="color" class="text-tool__color"/>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
